<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Security: CSP restricted to trusted fonts and local execution per OWASP standards -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline';">
    
    <title>Double Celebration | Happy Birthday!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-1: #ff9a9e;
            --primary-2: #a1c4fd;
            --bg-color: #f8f9fa;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --text-main: #2d3436;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
        }

        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        main#ui-layer {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* 3D Parallax & Flip Architecture */
        .flip-scene {
            width: 420px;
            height: 550px;
            perspective: 2000px;
            pointer-events: auto;
            transition: transform 0.1s ease-out;
        }

        .flip-card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .flip-card.is-flipped {
            transform: rotateY(180deg);
        }

        .flip-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 44px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .flip-back {
            transform: rotateY(180deg);
        }

        /* Technical Typography & UI */
        .sys-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: var(--primary-1);
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            font-weight: 800;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin: 0;
            background: linear-gradient(45deg, var(--primary-1), var(--primary-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
        }

        .message-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #636e72;
            line-height: 1.8;
            border-left: 3px solid var(--primary-1);
            padding-left: 20px;
            margin: 2rem 0;
            text-align: left;
            width: 100%;
        }

        .action-btn {
            padding: 16px 44px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.08);
            background: white;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .action-btn:hover {
            background: var(--text-main);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <canvas id="scene"></canvas>

    <main id="ui-layer">
        <article class="flip-scene" id="scene-container">
            <div class="flip-card" id="card">
                
                <!-- Front Side: Celebration One -->
                <section class="flip-face flip-front">
                    <div class="sys-label">First Celebrant</div>
                    <header>
                        <h1>Ricardo Hapsay Jr.</h1>
                        <div class="message-box">
                            > HAPPY BIRTHDAY<br>
                            > MESSAGE: WISHING YOU GOOD HEALTH, MORE BIRTHDAYS TO COME, AND MAY GOD BLESS YOU ALWAYS.<br>
                            > YEAR: JUNE 07, 1983
                        </div>
                    </header>
                    <button class="action-btn flip-trigger">NEXT CELEBRATION &rarr;</button>
                </section>

                <!-- Back Side: Celebration Two -->
                <section class="flip-face flip-back">
                    <div class="sys-label">SECOND CELEBRATION</div>
                    <header>
                        <h1>KATHY MONIQUE</h1>
                        <div class="message-box">
                            > HAPPY BIRTHDAY!<br>
                            > MESSAGE: WISHING YOU A HAPPY BIRTHDAY!<br>
                            > YEAR: JUNE 07, 2022
                        </div>
                    </header>
                    <button class="action-btn flip-trigger">&larr; PREVIOUS CELEBRATION</button>
                </section>

            </div>
        </article>
    </main>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        const flipCard = document.getElementById('card');
        const sceneContainer = document.getElementById('scene-container');
        const flipButtons = document.querySelectorAll('.flip-trigger');

        const celebrations = [
            { colors: ['#ff9a9e', '#fad0c4'] },
            { colors: ['#a1c4fd', '#c2e9fb'] }
        ];

        let currentState = 0;
        let particles = [];
        let mouse = { x: null, y: null };

        // --- Force-Directed Constellation Engine (CS Graph Theory) ---
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 2.5 + 1;
                this.color = celebrations[currentState].colors[0];
            }
            update() {
                if (mouse.x) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 250) {
                        this.vx += dx / 3000;
                        this.vy += dy / 3000;
                    }
                }
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 160) {
                        ctx.strokeStyle = celebrations[currentState].colors[0];
                        ctx.globalAlpha = (1 - dist/160) * 0.25;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;
        }

        function animate() {
            ctx.fillStyle = 'rgba(248, 249, 250, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawConnections();
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        // --- 3D Parallax Tilt (Spatial UI) ---
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x; mouse.y = e.y;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 35;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 35;
            sceneContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // --- Celebration Engine: Confetti & Balloons (Web Animations API) ---
        function triggerCelebration() {
            const themeColor = celebrations[currentState].colors[0];
            
            // Confetti Burst
            for (let i = 0; i < 65; i++) {
                const c = document.createElement('div');
                c.style.cssText = `position:fixed; width:10px; height:10px; background:${themeColor}; top:50%; left:50%; z-index:1000; border-radius:2px; pointer-events:none;`;
                document.body.appendChild(c);
                const angle = Math.random() * Math.PI * 2;
                const velocity = 160 + Math.random() * 220;
                c.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*velocity}px, ${Math.sin(angle)*velocity}px) rotate(720deg)`, opacity: 0 }
                ], { duration: 1400, easing: 'cubic-bezier(0, .9, .57, 1)' }).onfinish = () => c.remove();
            }

            // Balloon Rise
            for (let i = 0; i < 12; i++) {
                const b = document.createElement('div');
                b.innerHTML = '🎈';
                b.style.cssText = `position:fixed; bottom:-100px; left:${Math.random()*100}vw; font-size:${35+Math.random()*25}px; z-index:999; pointer-events:none; filter:hue-rotate(${Math.random()*360}deg);`;
                document.body.appendChild(b);
                b.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(-125vh) rotate(${Math.random()*60-30}deg)`, opacity: 0 }
                ], { duration: 4500 + Math.random()*2500, easing: 'ease-in' }).onfinish = () => b.remove();
            }
        }

        // --- State Management ---
        flipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentState = (currentState + 1) % 2;
                flipCard.classList.toggle('is-flipped');
                
                const theme = celebrations[currentState].colors;
                document.documentElement.style.setProperty('--primary-1', theme[0]);
                particles.forEach(p => p.color = theme[0]);
                
                triggerCelebration();
            });
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = Array.from({length: 110}, () => new Star());
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
